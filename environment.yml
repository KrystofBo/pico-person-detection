# Host-side Python environment for this project.
#   conda env create -f environment.yml
#   conda env update -f environment.yml --prune   # after editing this file
# Python 3.12 because the system Python 3.14 has no TF/LiteRT wheels.
name: pico-person-detection

channels:
  - defaults

dependencies:
  - python=3.12
  - pip
  - pip:
      # Reading .tflite models: the generated flatbuffers schema bindings.
      - flatbuffers==25.12.19
      - tflite==2.18.0
      # Host-side reference inference (step 03). Note tools/host_reference.py
      # pins BUILTIN_REF: the default XNNPACK delegate disagrees with the Pico.
      - ai-edge-litert==2.2.0
      # Image loading and preprocessing to 96x96 int8.
      - pillow==12.3.0
      # Talking to the Pico's USB CDC port.
      - pyserial==3.5
